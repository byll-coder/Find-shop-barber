<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var requis = null;
          var t = localStorage.getItem("sf_v2_token");
          var u = JSON.parse(localStorage.getItem("sf_v2_user") || "null");
          var ok = !!t;
          if (ok) {
            try {
              var p = JSON.parse(
                atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")),
              );
              if (p.exp && p.exp * 1000 < Date.now()) ok = false;
            } catch (e) {}
          }
          if (!ok) {
            localStorage.removeItem("sf_v2_token");
            localStorage.removeItem("sf_v2_user");
            location.replace("auth.html");
          } else if (requis && u && u.role && u.role !== requis) {
            location.replace("../index.html");
          }
        } catch (e) {}
      })();
    </script>
    <title>Messages — Salon Finder</title>
    <link rel="icon" type="image/png" href="../logo/logo-salonfinder.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/message.css" />
    <style>
      body {
        overflow: hidden;
      }

      /* ── FIX RESPONSIVE ─────────────────────────────────────────
         Sur mobile : on affiche SOIT la liste des conversations,
         SOIT le chat (classe .chat-open sur .msg-layout), avec un
         bouton retour. Placé ici pour passer APRÈS message.css.
         (les !important servent à écraser message.css que je n'ai
         pas vu — à nettoyer une fois message.css revu)
      ──────────────────────────────────────────────────────────── */
      .btn-back {
        display: none;
        background: none;
        border: none;
        color: inherit;
        font-size: 1.4rem;
        padding: 4px 8px 4px 0;
        cursor: pointer;
        flex-shrink: 0;
      }

      @media (max-width: 768px) {
        .msg-layout {
          display: flex !important;
          flex-direction: row !important;
          box-sizing: border-box;
          overflow: hidden;
          /* la hauteur exacte est calculée en JS (ajusterHauteur) */
        }
        .msg-layout .conv-sidebar {
          display: flex;
          flex-direction: column;
          width: 100% !important;
          max-width: none !important;
          min-height: 0;
          flex: 1 1 auto;
        }
        .msg-layout .conv-list {
          flex: 1 1 auto;
          min-height: 0;
          overflow-y: auto;
        }
        .msg-layout .chat-zone {
          display: none !important;
          width: 100%;
        }

        /* Conversation ouverte : on cache la liste, on montre le chat */
        .msg-layout.chat-open .conv-sidebar {
          display: none !important;
        }
        .msg-layout.chat-open .chat-zone {
          display: flex !important;
          flex-direction: column;
          flex: 1 1 auto;
          min-width: 0;
          min-height: 0;
        }

        /* Le champ d'envoi doit toujours rester visible en bas */
        .chat-zone .chat-header {
          flex: 0 0 auto;
        }
        .chat-zone .chat-messages {
          flex: 1 1 auto;
          min-height: 0;
          overflow-y: auto;
        }
        .chat-zone .chat-input-zone {
          flex: 0 0 auto;
          padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        }

        .btn-back {
          display: inline-flex;
          align-items: center;
        }
      }
    </style>
  </head>

    <nav class="navbar" role="navigation">
      <a href="../index.html" class="navbar-logo"

      <ul class="navbar-links">

        <li><a href="salons.html">Salons</a></li>

      <div class="navbar-right">

    <div class="mobile-menu" id="mobile-menu">

    <div class="msg-layout">
      <!-- SIDEBAR CONVERSATIONS -->
      <aside class="conv-sidebar">
        <div class="conv-sidebar-header">
          <p class="conv-sidebar-title">Messages</p>
          <div class="conv-search">
            <i class="ti ti-search"></i>
            <input
              type="text"
              id="search-conv"
              placeholder="Rechercher..."
              oninput="filtrerConvs()"
              aria-label="Rechercher une conversation"
            />
          </div>
        </div>
        <div class="conv-list" id="conv-list">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              height: 100px;
            "
          >
            <div class="spinner spinner-sm"></div>
          </div>
        </div>
      </aside>

      <!-- ZONE CHAT -->
      <div class="chat-zone" id="chat-zone">
        <div class="chat-empty" id="chat-empty">
          <i class="ti ti-message-circle-2"></i>
          <h3>Vos messages</h3>
          <p>Sélectionnez une conversation<br />ou contactez un salon.</p>
          <a href="salons.html" class="btn btn-gold" style="margin-top: 20px">
            <i class="ti ti-scissors"></i> Voir les salons</a
          >

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/socket.js"></script>
    <script>
      let toutesConvs = [];
      let convActuelle = null;
      // brouillon enrichi avec nom + avatar + salonId pour l'affichage correct
      let brouillon = null; // { to, salon, nom, avatar, salonId }
      let enAttente = [];
      let identiteChat = null; // { nom, avatar } de l'interlocuteur affiché

      /* ── Helpers ── */
      const enListe = (res, cle) =>
        Array.isArray(res)
          ? res
          : Array.isArray(res?.data)
            ? res.data
            : cle && Array.isArray(res?.[cle])
              ? res[cle]
              : [];
      const enObjet = (res) =>
        res?.conversation ||
        res?.message ||
        (res?.data && !Array.isArray(res.data) ? res.data : res);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const idDe = (x) => (x && typeof x === "object" ? x._id : x);
      const moi = () => Session.getUser() || {};
      const estMoi = (msg) => idDe(msg.expediteur) === moi()._id;

      function dateCourtMsg(iso) {
        if (!iso) return "";
        const d = new Date(iso),
          diff = (new Date() - d) / 1000;
        if (diff < 60) return "À l'instant";
        if (diff < 3600) return `${Math.floor(diff / 60)} min`;
        if (diff < 86400)
          return d.toLocaleTimeString("fr-FR", {
            hour: "2-digit",
            minute: "2-digit",
          });
        return d.toLocaleDateString("fr-FR", {
          day: "numeric",
          month: "short",
        });
      }

      const autreParticipant = (c) =>
        c?.participants?.find((p) => idDe(p) !== moi()._id) ||
        c?.participants?.[0];

      /* ── FIX PHOTO DU SALON : identité affichée d'une conversation ──
         Le participant d'une conversation est le COMPTE du propriétaire (User),
         qui n'a généralement pas de photo. Quand on écrit à un salon, on affiche
         donc le nom + la photo du SALON ; sinon la photo du brouillon disparaît
         dès que la vraie conversation s'ouvre après l'envoi du message. */
      const cacheSalons = {}; // salonId -> { id, nom, avatar, proprio }
      const salonParProprio = {}; // id du propriétaire -> info du salon
      const salonsEchec = new Set();
      let proprioAvertissement = false;

      function memoriserSalon(id, s, proprioParDefaut) {
        if (!s?.nom) return null;
        const sid = id || s._id;
        const champ =
          s.proprietaire ?? s.owner ?? s.user ?? s.utilisateur ?? s.createur;
        const info = {
          id: sid,
          nom: s.nom,
          avatar: s.photoCouverture || s.logo || null,
          proprio:
            idDe(champ) ||
            proprioParDefaut ||
            cacheSalons[sid]?.proprio ||
            null,
        };
        if (!info.proprio && !proprioAvertissement) {
          proprioAvertissement = true;
          console.warn(
            "Propriétaire du salon introuvable, champs reçus :",
            Object.keys(s),
          );
        }
        cacheSalons[sid] = info;
        if (info.proprio) salonParProprio[info.proprio] = info;
        return info;
      }

      function infoSalonDe(c) {
        const sal = c?.salon;
        if (sal && typeof sal === "object" && sal.nom)
          return memoriserSalon(sal._id, sal);
        return cacheSalons[idDe(sal)] || null;
      }

      async function chargerInfosSalons(convs) {
        const liste = (convs || []).filter(Boolean);
        liste.forEach((c) => infoSalonDe(c)); // salons déjà peuplés par le backend
        const ids = [
          ...new Set(liste.map((c) => idDe(c.salon)).filter(Boolean)),
        ].filter((id) => !cacheSalons[id] && !salonsEchec.has(id));
        await Promise.all(
          ids.map(async (id) => {
            try {
              const r = await Salons.detail(id);
              const s = r?.salon || r?.data?.salon || r?.data || r;
              if (!memoriserSalon(id, s)) salonsEchec.add(id);
            } catch (e) {
              salonsEchec.add(id);
            }
          }),
        );
        return ids.some((id) => cacheSalons[id]);
      }

      function identiteConv(c) {
        const autre = autreParticipant(c);
        const autreId = idDe(autre);
        const info = infoSalonDe(c) || salonParProprio[autreId] || null;
        // Identité du salon seulement si l'interlocuteur en est le propriétaire
        // (si c'est le propriétaire qui regarde, l'interlocuteur est un client
        // → on garde les infos du client).
        const auSalon = !!(info && info.proprio && info.proprio === autreId);
        return {
          nom: auSalon ? info.nom : autre?.nom || "Utilisateur",
          avatar: auSalon
            ? info.avatar || autre?.avatar || null
            : autre?.avatar || autre?.photoCouverture || null,
          salonId: idDe(c?.salon) || (auSalon ? info.id : null),
        };
      }

      /* ── FIX RESPONSIVE : hauteur exacte du layout sur mobile ──
         100vh inclut la barre d'adresse du navigateur mobile, ce qui
         coupe le bas de la page (donc le champ d'envoi). On calcule
         la hauteur réellement visible à partir de la position du layout. */
      function ajusterHauteur() {
        const layout = document.querySelector(".msg-layout");
        if (!layout) return;
        if (window.matchMedia("(max-width: 768px)").matches) {
          const top = layout.getBoundingClientRect().top;
          layout.style.height = Math.max(200, window.innerHeight - top) + "px";
        } else {
          layout.style.height = "";
        }
      }
      window.addEventListener("resize", ajusterHauteur);
      window.addEventListener("orientationchange", ajusterHauteur);
      window.addEventListener("load", ajusterHauteur);

      /* ── FIX RESPONSIVE : retour à la liste des conversations (mobile) ── */
      function retourListe() {
        document.querySelector(".msg-layout")?.classList.remove("chat-open");
      }

      /* ── Liste des conversations ── */
      function renderConvs(convs) {
        const el = document.getElementById("conv-list");
        convs = Array.isArray(convs) ? convs : [];
        if (!convs.length) {
          el.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--txt3);">
            <i class="ti ti-message-off" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
            <p style="font-size:.84rem;">Aucune conversation.</p></div>`;
          return;
        }
        el.innerHTML = convs
          .map((c) => {
            const autre = autreParticipant(c);
            const nonLus = c.nonLus
              ? c.nonLus[moi()._id] || c.nonLus.get?.(moi()._id) || 0
              : 0;
            const lastMsg =
              c.dernierMessage?.contenu || "Démarrer la conversation…";
            const ident = identiteConv(c);
            const init = (ident.nom || "?")[0].toUpperCase();
            const avatarSrc = ident.avatar;
            return `<div class="conv-item ${c._id === convActuelle ? "active" : ""}" data-id="${c._id}" onclick="ouvrirConv('${c._id}')">
            <div class="conv-av">${avatarSrc ? `<img src="${esc(avatarSrc)}" alt="">` : init}</div>
            <div class="conv-info">
              <p class="conv-name">${esc(ident.nom || "Utilisateur")}</p>
              <p class="conv-last">${esc(lastMsg.substring(0, 40))}${lastMsg.length > 40 ? "…" : ""}</p>
            </div>
            <div class="conv-meta">
              <span class="conv-time">${dateCourtMsg(c.dernierMessageAt)}</span>
              ${nonLus > 0 ? `<span class="conv-unread">${nonLus > 9 ? "9+" : nonLus}</span>` : ""}
            </div>
          </div>`;
          })
          .join("");
      }

      function filtrerConvs() {
        const q = document.getElementById("search-conv").value.toLowerCase();
        renderConvs(
          toutesConvs.filter((c) =>
            (identiteConv(c).nom || "").toLowerCase().includes(q),
          ),
        );
      }

      async function chargerConvs(depuisURL = false) {
        try {
          toutesConvs = enListe(
            await Messages.conversations(),
            "conversations",
          );
          renderConvs(toutesConvs);
          // charge nom/photo des salons concernés, puis réaffiche la liste
          chargerInfosSalons(toutesConvs).then((maj) => {
            if (maj) filtrerConvs();
          });
          if (depuisURL) await ouvrirDepuisURL();
        } catch (err) {
          console.error("Conversations :", err);
          document.getElementById("conv-list").innerHTML = `
            <div style="text-align:center;padding:40px 20px;color:var(--txt3);">
              <p style="font-size:.84rem;">${esc(err.message || "Erreur de chargement")}</p>
              <button class="btn btn-gold btn-sm" style="margin-top:12px" onclick="chargerConvs(true)">Réessayer</button>
            </div>`;
          afficherToast(err.message, "error");
        }
      }

      async function ouvrirDepuisURL() {
        const p = new URLSearchParams(window.location.search);
        if (p.get("conv")) return ouvrirConv(p.get("conv"));
        if (p.get("to"))
          return demarrerConversation(p.get("to"), p.get("salon"));
      }

      function trouverConv(to, salon) {
        return toutesConvs.find(
          (c) =>
            (c.participants || []).some((x) => idDe(x) === to) &&
            (!salon || !c.salon || idDe(c.salon) === salon),
        );
      }

      /* ── demarrerConversation récupère les vraies infos du salon ── */
      async function demarrerConversation(to, salon) {
        const existante = trouverConv(to, salon);
        if (existante) return ouvrirConv(existante._id);

        // Valeurs par défaut
        let nomAffiche = "Nouveau message";
        let avatarAffiche = null;
        let salonIdAffiche = salon || null;

        // Récupérer les infos du salon pour l'affichage
        if (salon) {
          try {
            const r = await Salons.detail(salon);
            // apiFetch retourne déjà json.data, donc on normalise
            const s = r?.salon || r?.data?.salon || r?.data || r;
            if (s && s.nom) {
              memoriserSalon(salon, s, to); // `to` = propriétaire du salon
              nomAffiche = s.nom;
              // Utiliser la photo de couverture comme avatar de la conv brouillon
              avatarAffiche = s.photoCouverture || s.logo || null;
            }
          } catch (e) {
            console.warn(
              "Impossible de charger le salon pour le brouillon :",
              e,
            );
          }
        }

        // Si on n'a toujours pas de nom (pas de salon), tenter via profil utilisateur
        if (nomAffiche === "Nouveau message" && to) {
          try {
            // Essaie les routes courantes ; échoue silencieusement si inexistante
            const u = await apiFetch(`/users/${to}`);
            const user = u?.user || u?.data || u;
            if (user?.nom) {
              nomAffiche = user.nom;
              avatarAffiche = user.avatar || null;
            }
          } catch (e) {
            // Route /users/:id peut ne pas exister — pas grave
          }
        }

        // Stocker toutes les infos dans le brouillon pour pouvoir les réutiliser
        brouillon = {
          to,
          salon,
          nom: nomAffiche,
          avatar: avatarAffiche,
          salonId: salonIdAffiche,
        };
        convActuelle = null;

        afficherChat({
          nom: nomAffiche,
          avatar: avatarAffiche,
          salonId: salonIdAffiche,
          msgs: [],
          convId: null,
        });

        document
          .getElementById("msg-input")
          ?.setAttribute("placeholder", "Écrivez votre premier message…");
      }

      /* ── FIX BUG 400 : la route de création est POST /messages/ouvrir
         (et non /messages/conversations, qui n'existe pas côté backend :
         la requête tombait dans POST /:convId avec convId="conversations",
         sans "contenu" → « Le message ne peut pas être vide ») ── */
      async function creerConversation(to, salon) {
        return apiFetch("/messages/ouvrir", {
          method: "POST",
          body: JSON.stringify({
            destinataire: to,
            destinataireId: to,
            participantId: to,
            salon,
            salonId: salon,
          }),
        });
      }

      /* ── Messages ── */
      function renderMsg(msg, isMine) {
        // utiliser avatar ou photoCouverture selon ce qui est disponible
        // messages de l'interlocuteur : on réutilise son identité affichée (photo du salon)
        const avatarSrc =
          (!isMine && identiteChat?.avatar) ||
          msg.expediteur?.avatar ||
          msg.expediteur?.photoCouverture ||
          null;
        const init = ((!isMine && identiteChat?.nom) ||
          msg.expediteur?.nom ||
          "?")[0].toUpperCase();
        return `<div class="msg-group ${isMine ? "mine" : ""}">
          ${
            !isMine
              ? `<div class="msg-ava">${
                  avatarSrc ? `<img src="${esc(avatarSrc)}" alt="">` : init
                }</div>`
              : ""
          }
          <div>
            <div class="msg-bubble">${esc(msg.contenu)}</div>
            <p class="msg-time">${dateCourtMsg(msg.createdAt)}</p>
          </div>
        </div>`;
      }

      function afficherChat({ nom, avatar, salonId, msgs, convId }) {
        identiteChat = { nom, avatar };
        const initA = (nom || "?")[0].toUpperCase();
        // afficher l'avatar (image) si disponible, sinon initiale
        const avatarHtml = avatar
          ? `<img src="${esc(avatar)}" alt="${esc(nom)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
          : initA;

        document.getElementById("chat-zone").innerHTML = `
          <div class="chat-header">
            <button class="btn-back" onclick="retourListe()" aria-label="Retour aux conversations">
              <i class="ti ti-arrow-left"></i></button>
            <div class="conv-av" style="flex-shrink:0;">${avatarHtml}</div>
            <div style="flex:1;">
              <p class="chat-header-name">${esc(nom || "Utilisateur")}</p>
              <p class="chat-header-status" id="user-status">
                <span class="online-dot"></span> En ligne</p>
            </div>
            ${
              salonId
                ? `<a href="salon-detail.html?id=${esc(idDe(salonId))}" class="btn btn-glass btn-sm">
              <i class="ti ti-scissors"></i> Voir le salon</a>`
                : ""
            }
          </div>

          <div class="chat-messages" id="chat-messages">
            ${
              msgs.length
                ? msgs.map((m) => renderMsg(m, estMoi(m))).join("")
                : `<div class="msg-vide" style="text-align:center;padding:40px;color:var(--txt3);">
                  <i class="ti ti-message-circle" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                  <p style="font-size:.84rem;">Début de la conversation</p></div>`
            }
            <div id="typing-wrap" style="display:none;">
              <div class="msg-group">
                <div class="conv-av" style="width:28px;height:28px;">${avatarHtml}</div>
                <div class="typing-indicator">
                  <div class="typing-dot"></div>
                  <div class="typing-dot"></div>
                  <div class="typing-dot"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="chat-input-zone">
            <div class="chat-input-row">
              <input type="text" id="msg-input" placeholder="Écrivez un message…"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();envoyerMsg();}"
                ${convId ? `oninput="try{Socket.startTyping('${convId}')}catch(e){}"` : ""}/>
              <button class="btn-send" id="btn-send" onclick="envoyerMsg()">
                <i class="ti ti-send"></i></button>
            </div>
          </div>`;

        // FIX RESPONSIVE : sur mobile, on bascule de la liste vers le chat
        document.querySelector(".msg-layout")?.classList.add("chat-open");
        ajusterHauteur();

        scrollBas();
        // sur mobile, éviter d'ouvrir le clavier automatiquement à l'arrivée sur le chat
        if (!window.matchMedia("(max-width: 768px)").matches) {
          document.getElementById("msg-input")?.focus();
        }
      }

      /* ── Ouvrir une conversation existante ── */
      async function ouvrirConv(convId) {
        convActuelle = convId;
        brouillon = null;
        enAttente = [];
        document
          .querySelectorAll(".conv-item")
          .forEach((el) =>
            el.classList.toggle("active", el.dataset.id === convId),
          );
        try {
          Socket.joinConv(convId);
        } catch (e) {
          console.warn("Socket indisponible :", e);
        }

        try {
          const msgs = enListe(await Messages.getMessages(convId), "messages");
          const conv = toutesConvs.find((c) => c._id === convId);
          await chargerInfosSalons([conv]);
          const ident = identiteConv(conv);
          afficherChat({
            nom: ident.nom,
            avatar: ident.avatar,
            salonId: ident.salonId || conv?.salon,
            msgs,
            convId,
          });
          chargerConvs();
        } catch (err) {
          console.error("Messages :", err);
          afficherToast(err.message, "error");
        }
      }

      /* ── Ajouter un message dans le chat ── */
      function appendMsg(msg, isMine) {
        const container = document.getElementById("chat-messages");
        const typing = document.getElementById("typing-wrap");
        if (!container) return null;
        container.querySelector(".msg-vide")?.remove();
        const el = document.createElement("div");
        el.innerHTML = renderMsg(msg, isMine);
        const noeud = el.firstElementChild;
        container.insertBefore(noeud, typing);
        return noeud;
      }

      function scrollBas() {
        const el = document.getElementById("chat-messages");
        if (el) el.scrollTop = el.scrollHeight;
      }

      /* ── Envoyer ── */
      async function envoyerMsg() {
        const input = document.getElementById("msg-input");
        const contenu = input?.value.trim();
        if (!contenu) return;

        if (!convActuelle && brouillon) return premierMessage(contenu, input);
        if (!convActuelle) return;

        input.value = "";
        const noeud = appendMsg(
          { contenu, createdAt: new Date().toISOString(), expediteur: moi() },
          true,
        );
        enAttente.push({ contenu, noeud });
        scrollBas();

        let sent = false;
        try {
          sent = Socket.sendMessage(convActuelle, contenu);
        } catch (e) {}
        if (!sent) {
          try {
            await Messages.envoyer(convActuelle, { contenu });
            enAttente = enAttente.filter((p) => p.noeud !== noeud);
            chargerConvs();
          } catch (err) {
            noeud?.remove();
            enAttente = enAttente.filter((p) => p.noeud !== noeud);
            afficherToast(err.message, "error");
            input.value = contenu;
          }
        }
      }

      async function premierMessage(contenu, input) {
        input.disabled = true;
        try {
          const conv = enObjet(
            await creerConversation(brouillon.to, brouillon.salon),
          );
          const id = conv?._id;
          if (!id) throw new Error("Le serveur n'a pas créé la conversation.");
          await Messages.envoyer(id, { contenu });
          brouillon = null;
          history.replaceState(
            null,
            "",
            "messages.html?conv=" + encodeURIComponent(id),
          );
          await chargerConvs();
          await ouvrirConv(id);
        } catch (err) {
          console.error("Création conversation :", err);
          afficherToast(err.message, "error");
          input.disabled = false;
          input.focus();
        }
      }

      /* ── Événements socket ── */
      function initSocketEvents() {
        Socket.on("message:receive", (msg) => {
          if (idDe(msg.conversation) === convActuelle) {
            const i = estMoi(msg)
              ? enAttente.findIndex((p) => p.contenu === msg.contenu)
              : -1;
            if (i >= 0) enAttente.splice(i, 1);
            else appendMsg(msg, estMoi(msg));
            scrollBas();
          }
          chargerConvs();
        });
        Socket.on("typing:start", ({ userId }) => {
          if (userId !== moi()._id)
            document
              .getElementById("typing-wrap")
              ?.style.setProperty("display", "block");
        });
        Socket.on("typing:stop", () => {
          document
            .getElementById("typing-wrap")
            ?.style.setProperty("display", "none");
        });
        Socket.on("user:offline", () => {
          const statusEl = document.getElementById("user-status");
          if (statusEl)
            statusEl.innerHTML =
              '<i class="ti ti-clock" style="font-size:.7rem;"></i> Hors ligne';
        });
      }

      /* ── Init ── */
      document.addEventListener("DOMContentLoaded", () => {
        if (!protegerPage()) return;
        majNavbar();
        ajusterHauteur();
        try {
          Socket.connect();
          initSocketEvents();
        } catch (e) {
          console.warn("Socket non initialisé :", e);
        }
        chargerConvs(true);
      });
    </script>
  </body>
</html>
