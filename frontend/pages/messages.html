<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Garde de connexion : s'exécute AVANT tout affichage (pas de flash de la page protégée) */
      (function () {
        try {
          var requis = null; // rôle autorisé sur cette page (null = tout utilisateur connecté)
          var t = localStorage.getItem("sf_v2_token");
          var u = JSON.parse(localStorage.getItem("sf_v2_user") || "null");
          var ok = !!t;
          if (ok) {
            try {
              // un token expiré = déconnecté
              var p = JSON.parse(
                atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")),
              );
              if (p.exp && p.exp * 1000 < Date.now()) ok = false;
            } catch (e) {}
          }
          if (!ok) {
            localStorage.removeItem("sf_v2_token");
            localStorage.removeItem("sf_v2_user");
            location.replace("auth.html");
          } else if (requis && u && u.role && u.role !== requis) {
            location.replace("../index.html");
          }
        } catch (e) {}
      })();
    </script>
    <title>Messages — Salon Finder</title>
    <link rel="icon" type="image/png" href="../logo/logo-salonfinder.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/message.css" />

    <style>
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="toast" id="global-toast" role="status" aria-live="polite"></div>

    <nav class="navbar" role="navigation">
      <a href="../index.html" class="navbar-logo"
        ><span class="navbar-logo-dot"></span> Salon<em>·</em>Finder</a
      >
      <ul class="navbar-links">
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="salons.html">Salons</a></li>
        <li><a href="messages.html" class="active">Messages</a></li>
      </ul>
      <div class="navbar-right">
        <button class="btn-theme" id="theme-btn">
          <i class="ti ti-moon"></i>
        </button>
        <div class="navbar-auth" id="navbar-auth"></div>
        <button
          class="hamburger"
          id="hamburger"
          aria-label="Menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
    <div class="mobile-menu" id="mobile-menu">
      <a href="../index.html"><i class="ti ti-home"></i> Accueil</a>
      <a href="salons.html"><i class="ti ti-scissors"></i> Salons</a>
      <a href="messages.html" class="active"
        ><i class="ti ti-message-circle"></i> Messages</a
      >
      <div class="mobile-menu-sep"></div>
      <div class="mobile-menu-btns" id="mobile-auth"></div>
    </div>

    <!-- Layout 2 colonnes -->
    <div class="msg-layout">
      <!-- SIDEBAR CONVERSATIONS -->
      <aside class="conv-sidebar">
        <div class="conv-sidebar-header">
          <p class="conv-sidebar-title">Messages</p>
          <div class="conv-search">
            <i class="ti ti-search"></i>
            <input
              type="text"
              id="search-conv"
              placeholder="Rechercher..."
              oninput="filtrerConvs()"
              aria-label="Rechercher une conversation"
            />
          </div>
        </div>
        <div class="conv-list" id="conv-list">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              height: 100px;
            "
          >
            <div class="spinner spinner-sm"></div>
          </div>
        </div>
      </aside>

      <!-- ZONE CHAT -->
      <div class="chat-zone" id="chat-zone">
        <div class="chat-empty" id="chat-empty">
          <i class="ti ti-message-circle-2"></i>
          <h3>Vos messages</h3>
          <p>Sélectionnez une conversation<br />ou contactez un salon.</p>
          <a href="salons.html" class="btn btn-gold" style="margin-top: 20px"
            ><i class="ti ti-scissors"></i> Voir les salons</a
          >
        </div>
      </div>
    </div>

    <!-- Socket.IO CDN -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/socket.js"></script>
    <script>
      let toutesConvs = [];
      let convActuelle = null;
      let brouillon = null; // conversation voulue (?to=…&salon=…) mais pas encore créée : elle l'est au 1er message
      let enAttente = []; // mes messages affichés tout de suite, en attente de confirmation du serveur

      /* ── Helpers ──
     apiFetch renvoie déjà json.data : on accepte [..] ou {data:[..]} */
      const enListe = (res, cle) =>
        Array.isArray(res)
          ? res
          : Array.isArray(res?.data)
            ? res.data
            : cle && Array.isArray(res?.[cle])
              ? res[cle]
              : [];
      const enObjet = (res) =>
        res?.conversation ||
        res?.message ||
        (res?.data && !Array.isArray(res.data) ? res.data : res);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const idDe = (x) => (x && typeof x === "object" ? x._id : x);
      const moi = () => Session.getUser() || {};
      const estMoi = (msg) => idDe(msg.expediteur) === moi()._id;

      function dateCourtMsg(iso) {
        if (!iso) return "";
        const d = new Date(iso),
          diff = (new Date() - d) / 1000;
        if (diff < 60) return "À l'instant";
        if (diff < 3600) return `${Math.floor(diff / 60)} min`;
        if (diff < 86400)
          return d.toLocaleTimeString("fr-FR", {
            hour: "2-digit",
            minute: "2-digit",
          });
        return d.toLocaleDateString("fr-FR", {
          day: "numeric",
          month: "short",
        });
      }

      const autreParticipant = (c) =>
        c?.participants?.find((p) => idDe(p) !== moi()._id) ||
        c?.participants?.[0];

      /* ── Liste des conversations ── */
      function renderConvs(convs) {
        const el = document.getElementById("conv-list");
        convs = Array.isArray(convs) ? convs : [];
        if (!convs.length) {
          el.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--txt3);"><i class="ti ti-message-off" style="font-size:2rem;display:block;margin-bottom:10px;"></i><p style="font-size:.84rem;">Aucune conversation.</p></div>`;
          return;
        }
        el.innerHTML = convs
          .map((c) => {
            const autre = autreParticipant(c);
            const nonLus = c.nonLus
              ? c.nonLus[moi()._id] || c.nonLus.get?.(moi()._id) || 0
              : 0;
            const lastMsg =
              c.dernierMessage?.contenu || "Démarrer la conversation…";
            const init = (autre?.nom || "?")[0].toUpperCase();
            return `<div class="conv-item ${c._id === convActuelle ? "active" : ""}" data-id="${c._id}" onclick="ouvrirConv('${c._id}')">
        <div class="conv-av">${autre?.avatar ? `<img src="${esc(autre.avatar)}" alt="">` : init}</div>
        <div class="conv-info">
          <p class="conv-name">${esc(autre?.nom || "Utilisateur")}</p>
          <p class="conv-last">${esc(lastMsg.substring(0, 40))}${lastMsg.length > 40 ? "…" : ""}</p>
        </div>
        <div class="conv-meta">
          <span class="conv-time">${dateCourtMsg(c.dernierMessageAt)}</span>
          ${nonLus > 0 ? `<span class="conv-unread">${nonLus > 9 ? "9+" : nonLus}</span>` : ""}
        </div>
      </div>`;
          })
          .join("");
      }

      function filtrerConvs() {
        const q = document.getElementById("search-conv").value.toLowerCase();
        renderConvs(
          toutesConvs.filter((c) =>
            (autreParticipant(c)?.nom || "").toLowerCase().includes(q),
          ),
        );
      }

      /* ── Charger les conversations
     depuisURL = true UNIQUEMENT au premier chargement (sinon boucle infinie) ── */
      async function chargerConvs(depuisURL = false) {
        try {
          toutesConvs = enListe(
            await Messages.conversations(),
            "conversations",
          );
          renderConvs(toutesConvs);
          if (depuisURL) await ouvrirDepuisURL();
        } catch (err) {
          console.error("Conversations :", err);
          document.getElementById("conv-list").innerHTML = `
        <div style="text-align:center;padding:40px 20px;color:var(--txt3);">
          <p style="font-size:.84rem;">${esc(err.message || "Erreur de chargement")}</p>
          <button class="btn btn-gold btn-sm" style="margin-top:12px" onclick="chargerConvs(true)">Réessayer</button>
        </div>`;
          afficherToast(err.message, "error");
        }
      }

      /* ── Arrivée depuis une fiche salon : ?to=<proprietaire>&salon=<salon> ── */
      async function ouvrirDepuisURL() {
        const p = new URLSearchParams(window.location.search);
        if (p.get("conv")) return ouvrirConv(p.get("conv"));
        if (p.get("to"))
          return demarrerConversation(p.get("to"), p.get("salon"));
      }

      function trouverConv(to, salon) {
        return toutesConvs.find(
          (c) =>
            (c.participants || []).some((x) => idDe(x) === to) &&
            (!salon || !c.salon || idDe(c.salon) === salon),
        );
      }

      async function demarrerConversation(to, salon) {
        const existante = trouverConv(to, salon);
        if (existante) return ouvrirConv(existante._id); // déjà en discussion : on la rouvre
        let nom = "Nouvelle conversation";
        if (salon) {
          try {
            const r = await Salons.detail(salon);
            nom = (r?.salon || r?.data?.salon || r?.data || r)?.nom || nom;
          } catch {}
        }
        brouillon = { to, salon };
        convActuelle = null;
        afficherChat({ nom, salonId: salon, msgs: [], convId: null });
        document
          .getElementById("msg-input")
          ?.setAttribute("placeholder", "Écrivez votre premier message…");
      }

      async function creerConversation(to, salon) {
        // ⚠ route à confirmer côté backend (POST /api/messages/conversations) — plusieurs noms de champs sont envoyés par prudence
        return apiFetch("/messages/conversations", {
          method: "POST",
          body: JSON.stringify({
            destinataire: to,
            destinataireId: to,
            participantId: to,
            salon,
            salonId: salon,
          }),
        });
      }

      /* ── Messages ── */
      function renderMsg(msg, isMine) {
        const init = (msg.expediteur?.nom || "?")[0].toUpperCase();
        return `<div class="msg-group ${isMine ? "mine" : ""}">
      ${!isMine ? `<div class="msg-ava">${msg.expediteur?.avatar ? `<img src="${esc(msg.expediteur.avatar)}" alt="">` : init}</div>` : ""}
      <div>
        <div class="msg-bubble">${esc(msg.contenu)}</div>
        <p class="msg-time">${dateCourtMsg(msg.createdAt)}</p>
      </div>
    </div>`;
      }

      function afficherChat({ nom, avatar, salonId, msgs, convId }) {
        const initA = (nom || "?")[0].toUpperCase();
        document.getElementById("chat-zone").innerHTML = `
      <div class="chat-header">
        <div class="conv-av" style="flex-shrink:0;">${avatar ? `<img src="${esc(avatar)}" alt="">` : initA}</div>
        <div style="flex:1;">
          <p class="chat-header-name">${esc(nom || "Utilisateur")}</p>
          <p class="chat-header-status" id="user-status"><span class="online-dot"></span> En ligne</p>
        </div>
        ${salonId ? `<a href="salon-detail.html?id=${esc(idDe(salonId))}" class="btn btn-glass btn-sm"><i class="ti ti-scissors"></i> Voir le salon</a>` : ""}
      </div>

      <div class="chat-messages" id="chat-messages">
        ${
          msgs.length
            ? msgs.map((m) => renderMsg(m, estMoi(m))).join("")
            : `<div class="msg-vide" style="text-align:center;padding:40px;color:var(--txt3);"><i class="ti ti-message-circle" style="font-size:2rem;display:block;margin-bottom:8px;"></i><p style="font-size:.84rem;">Début de la conversation</p></div>`
        }
        <div id="typing-wrap" style="display:none;">
          <div class="msg-group">
            <div class="conv-av" style="width:28px;height:28px;">${initA}</div>
            <div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
          </div>
        </div>
      </div>

      <div class="chat-input-zone">
        <div class="chat-input-row">
          <input type="text" id="msg-input" placeholder="Écrivez un message…"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();envoyerMsg();}"
            ${convId ? `oninput="try{Socket.startTyping('${convId}')}catch(e){}"` : ""}/>
          <button class="btn-send" id="btn-send" onclick="envoyerMsg()"><i class="ti ti-send"></i></button>
        </div>
      </div>`;
        scrollBas();
        document.getElementById("msg-input")?.focus();
      }

      /* ── Ouvrir une conversation existante ── */
      async function ouvrirConv(convId) {
        convActuelle = convId;
        brouillon = null;
        enAttente = [];
        document
          .querySelectorAll(".conv-item")
          .forEach((el) =>
            el.classList.toggle("active", el.dataset.id === convId),
          );
        try {
          Socket.joinConv(convId);
        } catch (e) {
          console.warn("Socket indisponible :", e);
        }

        try {
          const msgs = enListe(await Messages.getMessages(convId), "messages");
          const conv = toutesConvs.find((c) => c._id === convId);
          const autre = autreParticipant(conv);
          afficherChat({
            nom: autre?.nom,
            avatar: autre?.avatar,
            salonId: conv?.salon,
            msgs,
            convId,
          });
          chargerConvs(); // rafraîchit les non-lus, SANS rouvrir la conversation
        } catch (err) {
          console.error("Messages :", err);
          afficherToast(err.message, "error");
        }
      }

      /* ── Ajouter un message dans le chat ── */
      function appendMsg(msg, isMine) {
        const container = document.getElementById("chat-messages");
        const typing = document.getElementById("typing-wrap");
        if (!container) return null;
        container.querySelector(".msg-vide")?.remove(); // le « Début de la conversation » disparaît au 1er message
        const el = document.createElement("div");
        el.innerHTML = renderMsg(msg, isMine);
        const noeud = el.firstElementChild;
        container.insertBefore(noeud, typing);
        return noeud;
      }

      function scrollBas() {
        const el = document.getElementById("chat-messages");
        if (el) el.scrollTop = el.scrollHeight;
      }

      /* ── Envoyer ── */
      async function envoyerMsg() {
        const input = document.getElementById("msg-input");
        const contenu = input?.value.trim();
        if (!contenu) return;

        /* Première fois : on crée la conversation, puis on envoie le message */
        if (!convActuelle && brouillon) return premierMessage(contenu, input);
        if (!convActuelle) return;

        input.value = "";
        // le message s'affiche tout de suite (même si le serveur ne renvoie pas d'écho à l'expéditeur)
        const noeud = appendMsg(
          { contenu, createdAt: new Date().toISOString(), expediteur: moi() },
          true,
        );
        enAttente.push({ contenu, noeud });
        scrollBas();

        let sent = false;
        try {
          sent = Socket.sendMessage(convActuelle, contenu);
        } catch (e) {}
        if (!sent) {
          try {
            await Messages.envoyer(convActuelle, { contenu });
            enAttente = enAttente.filter((p) => p.noeud !== noeud);
            chargerConvs();
          } catch (err) {
            noeud?.remove();
            enAttente = enAttente.filter((p) => p.noeud !== noeud);
            afficherToast(err.message, "error");
            input.value = contenu;
          }
        }
      }

      async function premierMessage(contenu, input) {
        input.disabled = true;
        try {
          const conv = enObjet(
            await creerConversation(brouillon.to, brouillon.salon),
          );
          const id = conv?._id;
          if (!id) throw new Error("Le serveur n'a pas créé la conversation.");
          await Messages.envoyer(id, { contenu });
          brouillon = null;
          history.replaceState(
            null,
            "",
            "messages.html?conv=" + encodeURIComponent(id),
          );
          await chargerConvs();
          await ouvrirConv(id);
        } catch (err) {
          console.error("Création conversation :", err);
          afficherToast(err.message, "error");
          input.disabled = false;
          input.focus();
        }
      }

      /* ── Événements socket ── */
      function initSocketEvents() {
        Socket.on("message:receive", (msg) => {
          if (idDe(msg.conversation) === convActuelle) {
            const i = estMoi(msg)
              ? enAttente.findIndex((p) => p.contenu === msg.contenu)
              : -1;
            if (i >= 0)
              enAttente.splice(i, 1); // écho de mon propre message déjà affiché : pas de doublon
            else appendMsg(msg, estMoi(msg));
            scrollBas();
          }
          chargerConvs();
        });
        Socket.on("typing:start", ({ userId }) => {
          if (userId !== moi()._id)
            document
              .getElementById("typing-wrap")
              ?.style.setProperty("display", "block");
        });
        Socket.on("typing:stop", () => {
          document
            .getElementById("typing-wrap")
            ?.style.setProperty("display", "none");
        });
        Socket.on("user:offline", () => {
          const statusEl = document.getElementById("user-status");
          if (statusEl)
            statusEl.innerHTML =
              '<i class="ti ti-clock" style="font-size:.7rem;"></i> Hors ligne';
        });
      }

      /* ── Init ── */
      document.addEventListener("DOMContentLoaded", () => {
        if (!protegerPage()) return;
        majNavbar();
        try {
          Socket.connect();
          initSocketEvents();
        } catch (e) {
          console.warn("Socket non initialisé :", e); // les messages marchent quand même en HTTP
        }
        chargerConvs(true);
      });
    </script>
  </body>
</html>
